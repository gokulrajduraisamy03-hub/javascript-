<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Form Validation</title>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.2/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/ui/1.14.2/jquery-ui.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            width: 267px;
            margin: 20px auto;
            color: #444;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .field {
            margin-bottom: 17px;
        }

        input[type="text"],
        input[type="email"],
        select {
            box-sizing: border-box;
            width: 100%;
            height: 35px;
            border: 1px solid #aaa;
            border-radius: 5px;
            padding: 7px;
        }

        .error {
            display: block;
            color: #966969;
            font-size: 13px;
            margin-top: 7px;
        }

        .options {
            font-size: 14px;
            margin-bottom: 15px;
        }

        .options label {
            font-weight: normal;
            margin: 7px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background-color: #c9302c;
        }

        #success {
            color: green;
            font-size: 14px;
            margin-top: 12px;
        }
    </style>
</head>

<body>

    <form id="myForm">

        <div class="field">
            <label for="name">Your Name:</label>
            <input type="text" id="name">
            <span class="error" id="nameError">Must enter your name?</span>
        </div>

        <div class="field">
            <label for="email">Email:</label>
            <input type="email" id="email">
            <span class="error" id="emailError">
                The email is required in valid format!
            </span>
        </div>

        <div class="field">
            <label for="address">Address: (optional)</label>
            <input type="text" id="address">
        </div>

        <div class="field">
            <label for="terms">Agree with T&Cs?</label>
            <select id="terms">
                <option value="">Select</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>
            <span class="error" id="termsError">Required.</span>
        </div>

        <div class="options">
            <label>
                <input type="checkbox" name="skill" value="HTML"> HTML
            </label>

            <label>
                <input type="checkbox" name="skill" value="CSS"> CSS
            </label>

            <span class="error" id="skillError">
                You have to select one expertise.
            </span>
        </div>

        <div class="options">
            <label>
                <input type="radio" name="language" value="Python"> Python
            </label>

            <label>
                <input type="radio" name="language" value="Java"> Java
            </label>

            <label>
                <input type="radio" name="language" value="SQL"> SQL
            </label>

            <span class="error" id="languageError">
                Please select a language.
            </span>
        </div>

        <button type="submit">Proceed</button>

        <p id="success"></p>

    </form>

    <script>
        $(document).ready(function () {


            $(".error").hide();

            $("#myForm").submit(function (event) {

                event.preventDefault();

                $(".error").hide();
                $("#success").text("");

                let valid = true;

                let name = $("#name").val().trim();
                let email = $("#email").val().trim();
                let terms = $("#terms").val();


                if (name === "") {
                    $("#nameError").show();
                    valid = false;
                }


                let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (email === "" || !emailPattern.test(email)) {
                    $("#emailError").show();
                    valid = false;
                }


                if (terms !== "yes") {
                    $("#termsError").text("Please agree to the terms.").show();
                    valid = false;
                }


                if ($('input[name="skill"]:checked').length === 0) {
                    $("#skillError").show();
                    valid = false;
                }


                if ($('input[name="language"]:checked').length === 0) {
                    $("#languageError").show();
                    valid = false;
                }


                if (valid) {
                    $("#success").text("Form submitted successfully!");
                }
            });

        });
    </script>
</body>

</html>
